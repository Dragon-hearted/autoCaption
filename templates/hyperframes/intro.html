<!DOCTYPE html>
<!--
	Hyperframes template: intro
	A short branded open: logo/word-mark scales in, tagline reveals, then a wipe.

	Timing model:
	  - Stage carries data-composition-id / data-width / data-height.
	  - Animated elements carry data-start / data-duration (seconds).
	  - A PAUSED GSAP timeline is registered at window.__timelines["intro"]
	    for deterministic per-frame seeking by the Hyperframes engine.

	Parametrization: window.__props = { brand, tagline, background, color, accentColor }.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				height: 100%;
				overflow: hidden;
			}
			#stage {
				position: relative;
				width: 100%;
				height: 100%;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
				background: #0b0e14;
				color: #ffffff;
			}
			#brand {
				font-size: 120px;
				font-weight: 900;
				letter-spacing: -0.03em;
				text-align: center;
			}
			#tagline {
				margin-top: 24px;
				font-size: 42px;
				font-weight: 400;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				opacity: 0.78;
				text-align: center;
			}
			#wipe {
				position: absolute;
				inset: 0;
				background: #6c8cff;
				transform-origin: left center;
			}
		</style>
	</head>
	<body>
		<div id="stage" data-composition-id="intro" data-width="1080" data-height="1920">
			<h1 id="brand" data-start="0.3" data-duration="2">Brand</h1>
			<p id="tagline" data-start="0.7" data-duration="2">Tagline</p>
			<div id="wipe" data-start="0" data-duration="1.2"></div>
		</div>

		<!--__HF_PROPS__-->

		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
		<script>
			(function () {
				var props = window.__props || {};
				var stage = document.getElementById("stage");
				var brand = document.getElementById("brand");
				var tagline = document.getElementById("tagline");
				var wipe = document.getElementById("wipe");

				if (props.brand != null) brand.textContent = String(props.brand);
				if (props.tagline != null) tagline.textContent = String(props.tagline);
				if (props.background) stage.style.background = String(props.background);
				if (props.color) {
					brand.style.color = String(props.color);
					tagline.style.color = String(props.color);
				}
				if (props.accentColor) wipe.style.background = String(props.accentColor);

				var total = Number(props.durationInSeconds) || 3;

				var tl = gsap.timeline({ paused: true });
				tl.set(wipe, { scaleX: 1 })
					.to(wipe, { duration: 0.6, scaleX: 0, transformOrigin: "right center", ease: "power3.inOut" }, 0.4)
					.from(brand, { duration: 0.8, opacity: 0, scale: 0.7, ease: "back.out(1.6)" }, 0.5)
					.from(tagline, { duration: 0.6, opacity: 0, y: 24, ease: "power2.out" }, 0.9)
					.to({}, { duration: Math.max(0.4, total - 1.6) });

				window.__timelines = window.__timelines || {};
				window.__timelines["intro"] = tl;
			})();
		</script>
	</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <filter id="glow-0" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur" />
      <feFlood flood-color="#1E5A7A" flood-opacity="0.35" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="breathe-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feFlood flood-color="#1E5A7A" flood-opacity="0.25" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0s" fill="freeze" />
    <text x="400" y="72" text-anchor="middle" fill="#f3e8ff" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="700" filter="url(#glow-0)">autoCaption</text>
  </g>
  <line x1="340" y1="96" x2="460" y2="96" stroke="#1E5A7A" stroke-width="2" stroke-linecap="round" opacity="0">
    <animate attributeName="opacity" from="0" to="0.7" dur="0.6s" begin="0.3s" fill="freeze" />
  </line>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.6s" fill="freeze" />
    <text x="400" y="130" text-anchor="middle" fill="#d8b4fe" font-family="Inter, system-ui, sans-serif" font-size="15">Automated video captioning system using Whisper.cpp for transcription and Remotion for rendering TikTok-style word-highlighted captions onto vertical video</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.8s" fill="freeze" />
    <rect x="275.75" y="160" width="57.5" height="20" rx="10" fill="#1E5A7A18" stroke="#1E5A7A" stroke-width="1" />
    <text x="304.5" y="174" text-anchor="middle" fill="#1E5A7A" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500">video</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.9500000000000001s" fill="freeze" />
    <rect x="341.25" y="160" width="35" height="20" rx="10" fill="#1E5A7A18" stroke="#1E5A7A" stroke-width="1" />
    <text x="358.75" y="174" text-anchor="middle" fill="#1E5A7A" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500">ai</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.1s" fill="freeze" />
    <rect x="384.25" y="160" width="140" height="20" rx="10" fill="#8B2A1D18" stroke="#8B2A1D" stroke-width="1" />
    <text x="454.25" y="174" text-anchor="middle" fill="#8B2A1D" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="500">media-processing</text>
  </g>
</svg>